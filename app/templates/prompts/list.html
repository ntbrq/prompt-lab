{% extends "base.html" %}
{% block title %}Prompts - Prompt Lab{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Prompts</h1>
        <a href="/prompts/new" class="inline-flex items-center gap-2 px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700">
            <i data-lucide="plus" class="w-4 h-4"></i>
            New
        </a>
    </div>

    <div class="flex gap-6">
        <!-- Filters sidebar -->
        <aside class="w-56 flex-shrink-0 space-y-4">
            <div>
                <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Categories</h3>
                <div class="space-y-1">
                    <button hx-get="/api/prompts" hx-target="#prompt-list" hx-include="[name='q']"
                        class="block w-full text-left px-3 py-1.5 text-sm rounded hover:bg-gray-100 text-gray-700">All</button>
                    {% for cat in categories %}
                    <button hx-get="/api/prompts?category_id={{ cat.id }}" hx-target="#prompt-list"
                        class="block w-full text-left px-3 py-1.5 text-sm rounded hover:bg-gray-100 text-gray-700">
                        {{ cat.name }}
                        <span class="text-gray-400 text-xs">({{ cat.prompts.count() }})</span>
                    </button>
                    {% endfor %}
                </div>
            </div>
            <div>
                <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Tags</h3>
                <div class="flex flex-wrap gap-1">
                    {% for tag in tags %}
                    <button hx-get="/api/prompts?tag={{ tag.name }}" hx-target="#prompt-list"
                        class="text-xs px-2 py-1 bg-gray-100 rounded-full hover:bg-primary-100 hover:text-primary-700">
                        {{ tag.name }}
                    </button>
                    {% endfor %}
                </div>
            </div>
        </aside>

        <!-- Prompt list -->
        <div class="flex-1">
            <div class="mb-4">
                <input type="text" name="q" placeholder="Search prompts..."
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                    hx-get="/api/prompts" hx-trigger="input changed delay:300ms" hx-target="#prompt-list">
            </div>
            <div id="prompt-list"
                hx-get="/api/prompts" hx-trigger="load" hx-target="#prompt-list">
            </div>
        </div>
    </div>
</div>
{% endblock %}
