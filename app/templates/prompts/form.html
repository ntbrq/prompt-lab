{% extends "base.html" %}
{% block title %}{{ 'Edit' if prompt else 'New' }} Prompt - Prompt Lab{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">{{ 'Edit' if prompt else 'New' }} Prompt</h1>

    <form id="prompt-form" class="space-y-5" x-data="{ saving: false }"
        hx-{{ 'put' if prompt else 'post' }}="/api/prompts{{ '/' ~ prompt.id if prompt else '' }}"
        @htmx:beforeRequest="saving = true" @htmx:afterRequest="saving = false">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
            <input type="text" name="title" value="{{ prompt.title if prompt else '' }}" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Prompt Content</label>
            <textarea name="content" rows="10" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 font-mono text-sm">{{ prompt.content if prompt else '' }}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                <select name="category_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                    <option value="">None</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {{ 'selected' if prompt and prompt.category_id == cat.id else '' }}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Model Used</label>
                <input type="text" name="model_used" value="{{ prompt.model_used if prompt else '' }}" placeholder="e.g. glm-4-flash"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tags</label>
            <div class="flex flex-wrap gap-2" x-data="{ selected: {{ prompt.tags | map(attribute='id') | list if prompt else [] }} }">
                {% for tag in tags %}
                <label class="inline-flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" name="tag_ids" value="{{ tag.id }}"
                        :checked="selected.includes({{ tag.id }})"
                        @change="selected.includes({{ tag.id }}) ? selected = selected.filter(x => x !== {{ tag.id }}) : selected.push({{ tag.id }})"
                        class="rounded border-gray-300 text-primary-600 focus:ring-primary-500">
                    <span class="text-sm px-2 py-0.5 rounded-full"
                        :class="selected.includes({{ tag.id }}) ? 'bg-primary-100 text-primary-700' : 'bg-gray-100 text-gray-600'">
                        {{ tag.name }}
                    </span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Result Quality (1-5)</label>
            <div class="flex gap-1" x-data="{ rating: {{ prompt.result_quality if prompt and prompt.result_quality else 0 }} }">
                {% for i in range(1, 6) %}
                <button type="button" @click="rating = {{ i }}" class="p-1">
                    <i data-lucide="star" class="w-5 h-5" :class="rating >= {{ i }} ? 'text-yellow-400 fill-yellow-400' : 'text-gray-300'"></i>
                </button>
                {% endfor %}
                <input type="hidden" name="result_quality" :value="rating">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
            <textarea name="notes" rows="3"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">{{ prompt.notes if prompt else '' }}</textarea>
        </div>

        <div class="flex items-center gap-3">
            <button type="submit" class="px-6 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center gap-2"
                :disabled="saving">
                <svg x-show="saving" class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                <span x-show="!saving">{{ 'Update' if prompt else 'Create' }}</span>
                <span x-show="saving">Saving...</span>
            </button>
            <a href="/prompts{{ '/' ~ prompt.id if prompt else '' }}" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
