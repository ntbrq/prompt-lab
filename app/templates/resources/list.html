{% extends "base.html" %}
{% block title %}Resources - Prompt Lab{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Resource Collection</h1>
        <button onclick="document.getElementById('collect-modal').classList.remove('hidden')"
            class="inline-flex items-center gap-2 px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Collect
        </button>
    </div>

    <!-- Collect modal -->
    <div id="collect-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl p-6 w-full max-w-lg mx-4" @click.away="$el.parentElement.classList.add('hidden')">
            <h2 class="font-semibold text-lg mb-4">Collect Resource</h2>
            <form hx-post="/api/resources" hx-target="#resource-list" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Title</label>
                    <input type="text" name="title" placeholder="Resource title" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">URL (optional)</label>
                    <input type="url" name="url" placeholder="https://..."
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Content</label>
                    <textarea name="content" rows="6" placeholder="Paste the prompt or article content here..." required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"></textarea>
                </div>
                <div class="flex items-center gap-3">
                    <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm hover:bg-primary-700">Save for Review</button>
                    <button type="button" onclick="document.getElementById('collect-modal').classList.add('hidden')"
                        class="px-4 py-2 text-gray-600 hover:text-gray-800 text-sm">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Resource list -->
    <div id="resource-list"
        hx-get="/api/resources?status=pending_review" hx-trigger="load" hx-target="#resource-list">
        <div class="text-center py-12 text-gray-400">Loading...</div>
    </div>
</div>
{% endblock %}
