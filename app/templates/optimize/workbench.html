{% extends "base.html" %}
{% block title %}AI Optimize - Prompt Lab{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto" x-data="optimizeApp()">
    <h1 class="text-2xl font-bold mb-6">AI Optimization Workbench</h1>

    <div class="grid grid-cols-2 gap-6">
        <!-- Left: Original -->
        <div class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="font-semibold text-gray-700">Original Prompt</h2>
                <select x-model="optType" class="text-sm border border-gray-300 rounded px-2 py-1">
                    <option value="improve">Improve</option>
                    <option value="simplify">Simplify</option>
                    <option value="rephrase">Rephrase</option>
                    <option value="translate">Translate</option>
                    <option value="expand">Expand</option>
                </select>
            </div>
            <textarea x-model="originalContent" rows="12" placeholder="Paste your prompt here..."
                class="w-full px-4 py-3 border border-gray-300 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"></textarea>

            <div>
                <label class="text-sm text-gray-500">Context (optional)</label>
                <textarea x-model="context" rows="3" placeholder="Describe the use case..."
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 mt-1"></textarea>
            </div>

            <div class="flex items-center gap-3">
                <select x-model="selectedProvider" class="text-sm border border-gray-300 rounded px-2 py-1">
                    {% for config in ai_configs %}
                    <option value="{{ config.provider }}">{{ config.display_name }} ({{ config.default_model }})</option>
                    {% endfor %}
                </select>
                <button @click="optimize()" :disabled="streaming || !originalContent"
                    class="px-5 py-2 bg-gradient-to-r from-purple-500 to-primary-500 text-white rounded-lg font-medium hover:opacity-90 disabled:opacity-50">
                    <span x-show="!streaming">Optimize</span>
                    <span x-show="streaming">Optimizing...</span>
                </button>
            </div>
        </div>

        <!-- Right: Optimized -->
        <div class="space-y-4">
            <h2 class="font-semibold text-gray-700">Optimized Result</h2>
            <div class="relative">
                <pre x-ref="output" class="whitespace-pre-wrap bg-gray-50 border border-gray-200 rounded-lg p-4 text-sm font-mono min-h-[288px] overflow-auto"
                    x-text="output || 'Optimized prompt will appear here...'"></pre>
                <button x-show="output" @click="navigator.clipboard.writeText(output)"
                    class="absolute top-2 right-2 p-1 bg-white rounded border border-gray-200 text-gray-400 hover:text-gray-600">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="flex gap-2">
                <button x-show="output" @click="saveAsNew()"
                    class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm hover:bg-primary-700">
                    Save as New Prompt
                </button>
                <button x-show="output && promptId" @click="replaceOriginal()"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50">
                    Replace Original
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function optimizeApp() {
    return {
        originalContent: '',
        output: '',
        context: '',
        optType: 'improve',
        selectedProvider: '{{ ai_configs[0].provider if ai_configs else "" }}',
        streaming: false,
        promptId: null,

        async optimize() {
            this.streaming = true;
            this.output = '';

            try {
                const resp = await fetch('/api/ai/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: this.originalContent,
                        context: this.context || undefined,
                        optimization_type: this.optType,
                        provider: this.selectedProvider,
                    })
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            if (data.text) this.output += data.text;
                        }
                    }
                }
            } catch (e) {
                this.output = 'Error: ' + e.message;
            } finally {
                this.streaming = false;
            }
        },

        async saveAsNew() {
            const resp = await fetch('/api/prompts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: 'Optimized: ' + this.originalContent.slice(0, 50), content: this.output })
            });
            if (resp.ok) {
                const data = await resp.json();
                window.location.href = '/prompts/' + data.id;
            }
        }
    };
}
</script>
{% endblock %}
